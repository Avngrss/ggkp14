name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build dist
        run: |
          mkdir -p dist
          cp -r src/* dist/
          cp src/pages/index.html dist/index.html
          sed -i 's|\.\./css/|./css/|g; s|\.\./js/|./js/|g; s|\.\./assets/|./assets/|g' dist/index.html
          for page in content-page.html contacts.html table-page.html departments-index.html department.html department-aop.html news-archive.html news-single.html news-single-video.html news-single-no-media.html search-results.html paid-services.html information.html about.html applicant-2023.html adult-dispensary-examinations.html working-hours.html hot-line.html administration.html vacancies.html electronic-appeals.html email-addresses.html territorial-districts.html medical-tourism.html five-steps.html medical-extract-order.html dispensarization.html personal-appeals.html sexological-help.html; do
            sed -i "s|href=\"$page\"|href=\"pages/$page\"|g; s|action=\"$page\"|action=\"pages/$page\"|g" dist/index.html
          done
          rm -f dist/pages/preview.html
          touch dist/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    environment:
      name: ${{ fromJSON('["github-pages"]')[0] }}
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
